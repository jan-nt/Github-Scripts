name: Userscript checks

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: userscript-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate userscripts
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r -d '' file; do
            found=1
            node --check "$file"
          done < <(find . -maxdepth 1 -type f -name '*.user.js' -print0)
          test "$found" -eq 1

      - name: Validate userscript policy
        run: node scripts/validate-userscripts.mjs --verify-remote

      - name: Test userscript behavior
        run: |
          node scripts/test-search-input-normalizer.mjs
          node scripts/test-paymanager-parking-handoff.mjs
